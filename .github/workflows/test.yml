# 每次 push 跑不需要 LLM 的測試（工具、資料、agent loop）；手動觸發時另外跑會呼叫付費 API 的 agent 評測
name: tests
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vuln
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      ETL_DB_PASSWORD: ci-etl
      AGENT_DB_PASSWORD: ci-agent
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv
      - name: 建角色、資料表，載入測試資料
        env:
          PGHOST: localhost
          PGPASSWORD: ci
          POSTGRES_USER: postgres
          POSTGRES_DB: vuln
        run: |
          bash db/init.sh
          psql -U postgres -d vuln -v ON_ERROR_STOP=1 -f tests/fixtures.sql
      - run: uv run pytest
      - name: agent 評測（只在手動觸發時跑，資料是 tests/fixtures.sql 的假資料）
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run evals/run_agent.py
