[project]
name = "vuln-agent"
version = "0.1.0"
description = "AI 應用工程師學習路線：從零做出弱點分析 Agent"
readme = "README.md"
authors = [
    { name = "8loser", email = "8loser@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
vuln-agent = "vuln_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]
